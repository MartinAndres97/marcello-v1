services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
    volumes:
      - marcello_pgdata:/var/lib/postgresql/data   # persiste tras reiniciar o recrear contenedores
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:8000:8000"

  # Pruebas automáticas (base separada "marcello_test"; nunca toca los datos reales):
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TEST_DB_NAME: marcello_test
      REQUIRE_DB: "1"
    command: ["pytest", "-q"]

volumes:
  marcello_pgdata:
