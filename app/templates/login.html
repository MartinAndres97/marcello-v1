<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Marcello V1 · Administración</title>
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin login-body">
  <form id="login" class="login-card" novalidate>
    <img class="login-logo" src="/static/assets/marcello-v1-logo.jpg" alt="Marcello V1" width="1200" height="298">
    <p class="hint">Acceso administrativo</p>
    <label>Usuario <input id="username" autocomplete="username" required maxlength="100"></label>
    <label>Contraseña <input id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <p id="error" class="error" role="alert"></p>
    <button class="btn primary" type="submit">Ingresar</button>
  </form>
  <script src="/static/js/login.js"></script>
</body>
</html>
